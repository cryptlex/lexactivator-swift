name: Bug report
description: Something in the package does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For problems with a **license or your Cryptlex account**, contact
        support@cryptlex.com — this tracker is for the Swift package itself.
  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: "3.45.0"
    validations: { required: true }
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [iOS device, iOS simulator, macOS (Apple silicon), macOS (Intel)]
    validations: { required: true }
  - type: input
    id: versions
    attributes:
      label: Xcode and OS version
      placeholder: "Xcode 16.4, iOS 18.6"
    validations: { required: true }
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include the LexActivatorError code and message if there was one.
    validations: { required: true }
  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: The calls you make, in order. Never paste a license key or product data.
    validations: { required: true }
